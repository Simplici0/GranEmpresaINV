# Referencia documental del routing de producción.
# No es un archivo TLS completo: las directivas privadas de certificados se
# mantienen en el VPS y no se versionan en este repositorio.

server {
    listen 80;
    listen 443 ssl;
    server_name stocki.manosalaia.xyz;

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
